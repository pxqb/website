<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuraHook</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --cyan: #00f3ff;
            --magenta: #ff003c;
            --dark: #050505;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--dark);
            color: #fff;
            font-family: 'JetBrains Mono', monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            perspective: 1000px;
        }

        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        .grid-bg {
            position: absolute;
            top: 50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background-image: 
                linear-gradient(to right, rgba(0, 243, 255, 0.15) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 243, 255, 0.15) 1px, transparent 1px);
            background-size: 50px 50px;
            transform: rotateX(70deg) translateY(-50px);
            animation: moveGrid 10s linear infinite;
            z-index: 0;
            pointer-events: none;
            box-shadow: inset 0 0 100px 100px var(--dark);
        }

        @keyframes moveGrid {
            0% { transform: rotateX(70deg) translateY(0); }
            100% { transform: rotateX(70deg) translateY(50px); }
        }

        .container {
            position: relative;
            z-index: 10;
            background: rgba(5, 5, 5, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 243, 255, 0.3);
            box-shadow: 
                0 0 20px rgba(0, 243, 255, 0.2),
                inset 0 0 20px rgba(0, 243, 255, 0.1);
            padding: 3.5rem;
            width: 90%;
            max-width: 550px;
            text-align: center;
            clip-path: polygon(0 0, 100% 0, 100% calc(100% - 30px), calc(100% - 30px) 100%, 0 100%);
            animation: containerPulse 4s infinite alternate;
        }

        .container::before {
            content: '';
            position: absolute;
            bottom: 0;
            right: 0;
            width: 30px;
            height: 30px;
            background: var(--cyan);
            clip-path: polygon(100% 0, 0 100%, 100% 100%);
            box-shadow: 0 0 20px var(--cyan);
        }

        @keyframes containerPulse {
            0% { box-shadow: 0 0 15px rgba(0, 243, 255, 0.2), inset 0 0 10px rgba(0, 243, 255, 0.1); border-color: rgba(0, 243, 255, 0.3); }
            100% { box-shadow: 0 0 35px rgba(255, 0, 60, 0.3), inset 0 0 20px rgba(255, 0, 60, 0.1); border-color: rgba(255, 0, 60, 0.5); }
        }

        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 4.5rem;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
            position: relative;
            display: inline-block;
            color: #fff;
            text-shadow: 3px 3px 0px var(--cyan), -3px -3px 0px var(--magenta);
            animation: text-glitch 3s infinite;
        }

        h1::before, h1::after {
            content: 'AuraHook';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--dark);
        }

        h1::before {
            left: 3px;
            text-shadow: -2px 0 var(--magenta);
            clip-path: inset(24% 0 58% 0);
            animation: glitch-anim-1 2.5s infinite linear alternate-reverse;
        }

        h1::after {
            left: -3px;
            text-shadow: -2px 0 var(--cyan);
            clip-path: inset(54% 0 7% 0);
            animation: glitch-anim-2 3s infinite linear alternate-reverse;
        }

        @keyframes glitch-anim-1 {
            0% { clip-path: inset(20% 0 80% 0); transform: translate(-2px, 1px); }
            20% { clip-path: inset(60% 0 10% 0); transform: translate(2px, -1px); }
            40% { clip-path: inset(40% 0 50% 0); transform: translate(-2px, 2px); }
            60% { clip-path: inset(80% 0 5% 0); transform: translate(2px, -2px); }
            80% { clip-path: inset(10% 0 70% 0); transform: translate(-1px, 1px); }
            100% { clip-path: inset(30% 0 40% 0); transform: translate(1px, -1px); }
        }

        @keyframes glitch-anim-2 {
            0% { clip-path: inset(10% 0 60% 0); transform: translate(2px, -1px); }
            20% { clip-path: inset(30% 0 20% 0); transform: translate(-2px, 1px); }
            40% { clip-path: inset(70% 0 10% 0); transform: translate(2px, -2px); }
            60% { clip-path: inset(20% 0 50% 0); transform: translate(-2px, 2px); }
            80% { clip-path: inset(50% 0 30% 0); transform: translate(1px, -1px); }
            100% { clip-path: inset(5% 0 80% 0); transform: translate(-1px, 1px); }
        }

        @keyframes text-glitch {
            0%, 96%, 98%, 100% { transform: skewX(0deg); }
            97% { transform: skewX(10deg); }
            99% { transform: skewX(-10deg); }
        }

        .subtitle {
            color: #ccc;
            font-size: 1rem;
            margin-bottom: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 5px rgba(255,255,255,0.4);
        }

        .btn {
            display: inline-block;
            padding: 1.2rem 3.5rem;
            background: transparent;
            color: var(--cyan);
            text-decoration: none;
            font-weight: 700;
            font-size: 1.2rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            border: 2px solid var(--cyan);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.4), inset 0 0 10px rgba(0, 243, 255, 0.2);
            transition: all 0.15s ease-out;
            position: relative;
            overflow: hidden;
            z-index: 1;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 243, 255, 0.4), transparent);
            transition: left 0.5s;
            z-index: -1;
        }

        .btn:hover {
            background: var(--cyan);
            color: var(--dark);
            box-shadow: 0 0 40px var(--cyan), inset 0 0 20px rgba(255,255,255,0.5);
            text-shadow: none;
        }

        .btn:hover::before {
            left: 100%;
        }

        .media-container {
            margin-top: 3rem;
            position: relative;
            border: 2px solid rgba(255, 0, 60, 0.5);
            box-shadow: 0 0 25px rgba(255, 0, 60, 0.3);
            overflow: hidden;
        }

        .media-container::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0, 243, 255, 0.15) 2px,
                rgba(0, 243, 255, 0.15) 4px
            );
            pointer-events: none;
            z-index: 1;
        }

        img {
            width: 100%;
            display: block;
            filter: contrast(1.3) brightness(0.9) saturate(1.2);
            animation: img-glitch 5s infinite;
        }

        @keyframes img-glitch {
            0%, 94%, 96%, 100% { filter: contrast(1.3) brightness(0.9) saturate(1.2) hue-rotate(0deg); transform: translate(0) scale(1); }
            95% { filter: contrast(2) brightness(1.5) saturate(3) hue-rotate(90deg); transform: translate(-4px, 4px) scale(1.02); }
            97% { filter: contrast(1.5) brightness(1.2) saturate(2) hue-rotate(-90deg); transform: translate(4px, -4px) scale(1.02); }
            98% { filter: contrast(2) brightness(0.5) saturate(4) hue-rotate(180deg); transform: translate(-2px, 0) scale(1.01); }
        }

        @media (max-width: 480px) {
            h1 { font-size: 3rem; }
            .container { padding: 2rem 1.5rem; }
        }
    </style>
</head>
<body>
    <div class="grid-bg"></div>
    <div class="container">
        <h1>AuraHook</h1>
        <p class="subtitle">the best phantom forces script.</p>
        <a href="https://discord.gg/wsaaCxJf4C" class="btn">Discord</a>
        <div class="media-container">
            <img src="cristiano-ronaldo-ronaldo.gif" alt="Ronaldo">
        </div>
    </div>
</body>
</html>
