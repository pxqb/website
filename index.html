<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:title" content="aurahook">
    <meta property="og:description" content="aurahook">
    <meta property="og:type" content="website">
    <meta name="theme-color" content="#20dfaf">
    <title>aurahook</title>
    <style>
        html,
        body {
            background: rgba(10, 10, 10, 0.9);
            overflow: hidden;
            height: 100%;
            margin: 0;
            padding: 0;
        }

        .ctr {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
            position: fixed;
            top: 0;
            left: 0;
        }

        .bg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            min-width: 213px;
            min-height: 135px;
            width: max-content;
            height: auto;
            background: rgba(10, 10, 10, 0.9);
            color: white;
            z-index: 999999999;
            border: 1px solid #050505;
            background: url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAgAAAAICAYAAADED76LAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAJcEhZcwAADsMAAA7DAcdvqGQAAAAlSURBVChTYxAREfnPw8PzHxeNogCGkfnEmQDDyDph/IF3A89/ABQxTIGh/maWAAAAAElFTkSuQmCC') repeat;
            font-family: 'Verdana', sans-serif !important;
            font-size: 13px !important;
            color: #cccccc;
        }

        .border-light {
            border: 1px solid #3c3c3c;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .border-dark {
            border: 3px solid #282828;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .border-inside {
            border: 1px solid #3c3c3c;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .rainbow-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 3px;
        }

        .rainbow-1,
        .rainbow-2 {
            height: 1px;
            width: 100%;
            background-size: 200% 100%;
            animation: shimmer 2s linear infinite;
        }

        .rainbow-1 {
            background-image: linear-gradient(
                to right,
                #38b0da,
                #cb46cd,
                #cce335,
                #cb46cd,
                #38b0da
            );
        }

        .rainbow-2 {
            background-image: linear-gradient(
                to right,
                #1d5e74,
                #6c256d,
                #6d791c,
                #6c256d,
                #1d5e74
            );
            animation-delay: 1s;
        }

        .rainbow-3 {
            height: 1px;
            width: 100%;
            background: #090909;
        }

        @keyframes shimmer {
            0% {
                background-position: -100% 50%;
            }
            100% {
                background-position: 100% 50%;
            }
        }

        .bg .items *,
        .item,
        .body {
            font-family: 'Verdana', sans-serif !important;
            letter-spacing: normal !important;
            font-size: 13px !important;
            color: #cccccc;
            font-weight: 500;
            text-shadow: 1px 1px 0px #050505;
        }

        .body {
            padding: 8px;
        }

        .ctrd {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .items {
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .container {
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .inside {
            display: flex;
            flex-direction: column;
            flex: 1;
            justify-content: center;
        }

        .links {
            display: flex;
            flex-direction: column;
            margin-top: 12px;
        }

        .title {
            font-weight: bold !important;
            text-align: center;
            user-select: none;
        }

        .button {
            border: 1px solid #323232;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 165px;
            height: 22px;
            padding-bottom: 3px;
            margin-bottom: 8px;
            background: linear-gradient(0deg, #191919, #232323);
            outline: none;
            font-weight: 700;
            text-decoration: none;
            color: #cccccc;
            box-sizing: border-box;
            cursor: pointer;
            user-select: none;
            transition: background 0.1s;
        }

        .button:hover {
            background: linear-gradient(0deg, #232323, #343434);
        }

        .button:active {
            background: linear-gradient(0deg, #232323, #191919);
        }
    </style>
</head>
<body>
    <div id="main-content">
        <div class="ctr">
            <div class="bg">
                <div class="items">
                    <div class="border-light">
                        <div class="border-dark">
                            <div class="border-inside">
                                <div class="container">
                                    <div class="rainbow-container">
                                        <div class="rainbow-1"></div>
                                        <div class="rainbow-2"></div>
                                        <div class="rainbow-3"></div>
                                    </div>
                                    <div id="inside" class="inside">
                                        <div id="body" class="body ctrd">
                                            <span class="title">aurahook</span>
                                            <div class="links">
                                                <a href="/purchase" id="buy-btn" class="button">buy</a>
                                                <a href="/media" class="button">media</a>
                                                <a href="https://discord.gg/wsaaCxJf4C" target="_blank" rel="noopener noreferrer" class="button">discord</a>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
